<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B3 Terminal — {% if modo == 'login' %}Entrar{% else %}Criar Conta{% endif %}</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060a0f;--bg2:#0c1219;--bg3:#111a24;--bd:#1c2e40;
  --g:#00e676;--gd:rgba(0,230,118,.1);
  --r:#ff3d57;--rd:rgba(255,61,87,.1);
  --a:#ffc400;
  --t:#b8ccde;--td:#3d5a72;--tb:#e2f0ff;
  --mono:'Space Mono',monospace;--sans:'Syne',sans-serif;
}
html,body{background:var(--bg);color:var(--t);font-family:var(--mono);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(0,230,118,.07) 0%,transparent 65%);pointer-events:none;z-index:0}

@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}

.wrap{width:100%;max-width:420px;position:relative;z-index:1;animation:fadeIn .4s ease}

/* Logo */
.logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:32px}
.logo-box{width:44px;height:44px;background:var(--g);border-radius:10px;display:grid;place-items:center;font-family:var(--sans);font-weight:800;font-size:15px;color:#000}
.logo-text{}
.logo-name{font-family:var(--sans);font-weight:800;font-size:20px;color:var(--tb);letter-spacing:3px}
.logo-sub{font-size:9px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-top:2px}

/* Live dot */
.live{display:flex;align-items:center;justify-content:center;gap:5px;font-size:9px;color:var(--g);letter-spacing:2px;text-transform:uppercase;margin-bottom:24px}
.dot{width:6px;height:6px;background:var(--g);border-radius:50%;animation:blink 1.4s infinite}

/* Card */
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:32px 28px;box-shadow:0 20px 60px rgba(0,0,0,.7)}

/* Tabs */
.tabs{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;margin-bottom:26px}
.tab{flex:1;padding:10px;text-align:center;font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.2s;text-transform:uppercase;text-decoration:none;display:block;color:var(--td)}
.tab.on{background:var(--gd);color:var(--g)}
.tab:hover:not(.on){color:var(--t)}

/* Field */
.field{margin-bottom:16px}
.field label{display:block;font-size:9px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.field input{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;color:var(--tb);font-family:var(--mono);font-size:13px;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--g)}
.field input::placeholder{color:var(--td)}

/* Button */
.btn{width:100%;padding:13px;background:var(--g);color:#000;border:none;border-radius:8px;font-family:var(--mono);font-size:13px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:.2s;margin-top:4px}
.btn:hover{opacity:.88}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Message */
.msg{font-size:11px;text-align:center;margin-top:12px;min-height:18px;padding:0 4px;line-height:1.5}
.msg.err{color:var(--r)}
.msg.ok{color:var(--g)}

/* Footer */
.footer{margin-top:24px;font-size:9px;color:var(--td);letter-spacing:1px;text-align:center}
</style>
</head>
<body>

<div class="wrap">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-box">B3</div>
    <div class="logo-text">
      <div class="logo-name">B3 TERMINAL</div>
      <div class="logo-sub">Plataforma de Investimentos</div>
    </div>
  </div>

  <div class="live"><div class="dot"></div>ACESSO RESTRITO</div>

  <div class="card">

    <!-- Tabs -->
    <div class="tabs">
      <a href="/login"    class="tab {% if modo=='login'    %}on{% endif %}">Entrar</a>
      <a href="/cadastro" class="tab {% if modo=='cadastro' %}on{% endif %}">Criar conta</a>
    </div>

    <!-- LOGIN -->
    {% if modo == 'login' %}
    <div class="field">
      <label>E-mail</label>
      <input id="email" type="email" autocomplete="email" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="field">
      <label>Senha</label>
      <input id="senha" type="password" autocomplete="current-password" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn" id="btn" onclick="doLogin()">ENTRAR</button>
    <div class="msg" id="msg"></div>
    {% endif %}

    <!-- CADASTRO -->
    {% if modo == 'cadastro' %}
    <div class="field">
      <label>Nome</label>
      <input id="nome" type="text" autocomplete="name" placeholder="Seu nome" onkeydown="if(event.key==='Enter')doCadastro()">
    </div>
    <div class="field">
      <label>E-mail</label>
      <input id="email" type="email" autocomplete="email" placeholder="seu@email.com" onkeydown="if(event.key==='Enter')doCadastro()">
    </div>
    <div class="field">
      <label>Senha <span style="color:var(--td);font-size:8px">(mínimo 6 caracteres)</span></label>
      <input id="senha" type="password" autocomplete="new-password" placeholder="••••••" onkeydown="if(event.key==='Enter')doCadastro()">
    </div>
    <button class="btn" id="btn" onclick="doCadastro()">CRIAR CONTA</button>
    <div class="msg" id="msg"></div>
    {% endif %}

  </div>

  <div class="footer">Faça login para acessar o terminal · Acesso restrito</div>
</div>

<script>
async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value.trim();
  const msg   = document.getElementById('msg');
  const btn   = document.getElementById('btn');
  if (!email || !senha) { msg.className='msg err'; msg.textContent='Preencha todos os campos.'; return; }
  btn.disabled=true; btn.textContent='AGUARDE...'; msg.textContent='';
  try {
    const r = await fetch('/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, senha})
    });
    const d = await r.json();
    if (!r.ok) { msg.className='msg err'; msg.textContent=d.error||'Erro ao entrar.'; btn.disabled=false; btn.textContent='ENTRAR'; return; }
    msg.className='msg ok'; msg.textContent='Bem-vindo, '+d.nome+'! Redirecionando...';
    setTimeout(()=>window.location.href='/', 800);
  } catch(e) { msg.className='msg err'; msg.textContent='Erro de conexão.'; btn.disabled=false; btn.textContent='ENTRAR'; }
}

async function doCadastro() {
  const nome  = document.getElementById('nome')?.value.trim();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value.trim();
  const msg   = document.getElementById('msg');
  const btn   = document.getElementById('btn');
  if (!nome || !email || !senha) { msg.className='msg err'; msg.textContent='Preencha todos os campos.'; return; }
  btn.disabled=true; btn.textContent='CRIANDO...'; msg.textContent='';
  try {
    const r = await fetch('/api/auth/cadastro', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({nome, email, senha})
    });
    const d = await r.json();
    if (!r.ok) { msg.className='msg err'; msg.textContent=d.error||'Erro ao criar conta.'; btn.disabled=false; btn.textContent='CRIAR CONTA'; return; }
    msg.className='msg ok'; msg.textContent='Conta criada! Entrando...';
    setTimeout(()=>window.location.href='/', 800);
  } catch(e) { msg.className='msg err'; msg.textContent='Erro de conexão.'; btn.disabled=false; btn.textContent='CRIAR CONTA'; }
}

// Foca no primeiro campo ao carregar
window.addEventListener('load', () => {
  const first = document.querySelector('input');
  if (first) first.focus();
});
</script>
</body>
</html>
