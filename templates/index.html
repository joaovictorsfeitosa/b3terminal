<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERIDIAN — Plataforma de Investimentos</title>
<meta name="description" content="MERIDIAN — Plataforma de inteligência financeira. Acompanhe cotações, dividendos e carteira em tempo real.">
<meta name="theme-color" content="#00e5b0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2300e5b0'/%3E%3Cstop offset='1' stop-color='%2300b0ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial Black' font-size='14' font-weight='900' fill='black'%3EB3%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#040810;--bg2:#080e18;--bg3:#0d1520;--bd:#172030;
  --g:#00e676;--gd:rgba(0,230,118,.08);--gb:rgba(0,230,118,.15);
  --ui1:#00e5b0;--ui2:#00b0ff;--ui-grd:linear-gradient(135deg,#00e5b0,#00b0ff);
  --r:#ff3d57;--rd:rgba(255,61,87,.08);
  --a:#ffc400;--ad:rgba(255,196,0,.08);
  --b:#38bdf8;--bld:rgba(56,189,248,.08);
  --p:#c084fc;--pd:rgba(192,132,252,.08);
  --t:#94a8be;--td:#2e4560;--tb:#ddeeff;
  --mono:'Space Mono',monospace;--sans:'Syne',sans-serif;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --glow:0 0 20px rgba(0,229,176,.15);
  --ui1:#00e5b0;--ui2:#00b0ff;
  --ui-grd:linear-gradient(135deg,#00e5b0,#00b0ff);
}
html,body{background:var(--bg);color:var(--t);font-family:var(--mono);font-size:13px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:
  radial-gradient(ellipse at 15% 0%,rgba(0,176,255,.04) 0%,transparent 50%),
  radial-gradient(ellipse at 85% 100%,rgba(56,189,248,.03) 0%,transparent 50%);
  pointer-events:none;z-index:0}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
::-webkit-scrollbar-thumb:hover{background:var(--td)}
input,select,button{font-family:var(--mono);font-size:12px}
a{text-decoration:none;color:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes tkrun{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:.9}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}

/* INDEX CARDS */
.idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:22px}
.idx-card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:15px;
  position:relative;overflow:hidden;transition:all .2s;cursor:default}
.idx-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,176,255,.03),transparent);pointer-events:none}
.idx-card:hover{border-color:rgba(0,176,255,.3);transform:translateY(-1px)}
.idx-n{font-size:9px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.idx-v{font-family:var(--sans);font-size:18px;font-weight:800;color:var(--tb);letter-spacing:-1px;margin-bottom:4px}
.idx-c{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;display:inline-block}
.idx-c.up{background:rgba(0,230,118,.1);color:var(--g);border:1px solid rgba(0,230,118,.2)}
.idx-c.dn{background:var(--rd);color:var(--r);border:1px solid rgba(255,61,87,.2)}

/* ══════════════════════════════════════════════
   HEADER — premium redesign
══════════════════════════════════════════════ */
#hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:56px;
  background:rgba(4,8,16,.92);
  border-bottom:1px solid rgba(0,176,255,.08);
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  box-shadow:0 1px 0 rgba(0,176,255,.06),0 4px 24px rgba(0,0,0,.3);
}
/* subtle gradient line on top of header */
#hdr::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent 0%,rgba(0,229,176,.4) 30%,rgba(0,176,255,.4) 70%,transparent 100%);
  pointer-events:none;
}
.logo{display:flex;align-items:center;gap:14px}
.logo-box{
  width:36px;height:36px;
  background:var(--ui-grd);border-radius:10px;
  display:grid;place-items:center;
  font-family:var(--sans);font-weight:800;font-size:13px;color:#000;
  box-shadow:0 0 16px rgba(0,176,255,.3),0 2px 8px rgba(0,0,0,.4);
  transition:box-shadow .3s;
}
.logo-box:hover{box-shadow:0 0 24px rgba(0,229,176,.5),0 2px 8px rgba(0,0,0,.4)}
.logo-name{
  font-family:var(--sans);font-weight:800;font-size:16px;
  color:var(--tb);letter-spacing:5px;
  background:linear-gradient(135deg,#fff 60%,rgba(0,229,176,.7));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo-sub{font-size:8px;color:var(--td);letter-spacing:2.5px;text-transform:uppercase;margin-top:1px}
.hdr-r{display:flex;align-items:center;gap:12px}

/* live indicator */
.live{
  display:flex;align-items:center;gap:5px;
  font-size:8px;color:var(--ui1);letter-spacing:2.5px;text-transform:uppercase;
  background:rgba(0,229,176,.06);border:1px solid rgba(0,229,176,.15);
  border-radius:20px;padding:4px 10px;
}
.dot{width:6px;height:6px;background:var(--ui1);border-radius:50%;animation:pulse 2s infinite;flex-shrink:0}

/* clock */
#clock{
  font-size:13px;color:var(--a);letter-spacing:1.5px;
  font-family:var(--mono);
  background:rgba(255,196,0,.05);border:1px solid rgba(255,196,0,.12);
  border-radius:6px;padding:4px 10px;
}
#eta{font-size:8px;color:var(--td);letter-spacing:.5px}

/* user info block */
#user-info{
  display:flex;align-items:center;gap:10px;
  border-left:1px solid rgba(255,255,255,.05);
  padding-left:14px;
}
#user-nome{font-size:11px;color:var(--tb);font-weight:700;letter-spacing:.5px}
#user-email{font-size:8px;color:var(--td);letter-spacing:1px}

/* admin button */
#adminBtn{
  display:none;
  background:rgba(255,196,0,.08);
  border:1px solid rgba(255,196,0,.3);
  color:var(--a);
  padding:5px 12px;border-radius:8px;
  cursor:pointer;font-size:9px;letter-spacing:1.5px;
  transition:all .2s;font-family:var(--mono);
  text-decoration:none;align-items:center;gap:5px;
  white-space:nowrap;
}
#adminBtn:hover{background:rgba(255,196,0,.18);border-color:var(--a);box-shadow:0 0 12px rgba(255,196,0,.2)}

/* logout button */
.btn-logout-hdr{
  background:rgba(255,61,87,.06);
  border:1px solid rgba(255,61,87,.2);
  color:var(--r);
  padding:5px 12px;border-radius:8px;
  cursor:pointer;font-size:9px;letter-spacing:1.5px;
  transition:all .2s;font-family:var(--mono);
  white-space:nowrap;
}
.btn-logout-hdr:hover{background:var(--r);color:#fff;border-color:var(--r);box-shadow:0 0 12px rgba(255,61,87,.3)}

/* TICKER */
#tkbar{height:28px;background:rgba(8,14,24,.9);border-bottom:1px solid var(--bd);display:flex;overflow:hidden;align-items:center}
.tk-tag{background:var(--ui-grd);color:#000;font-size:9px;font-weight:700;padding:0 10px;height:100%;display:grid;place-items:center;letter-spacing:1px;flex-shrink:0}
#tk-inner{overflow:hidden;flex:1;height:100%}
#tk-scroll{display:inline-flex;white-space:nowrap;align-items:center;height:100%}
.tk-item{display:inline-flex;align-items:center;gap:6px;padding:0 14px;font-size:10px;border-right:1px solid var(--bd);height:100%}
.tk-sym{color:var(--tb);font-weight:700}
.up{color:var(--g)}.dn{color:var(--r)}

/* ══════════════════════════════════════════════
   TABS — horizontal (tablet/small screens)
══════════════════════════════════════════════ */
#tabs{
  display:flex;
  background:rgba(4,8,16,.94);
  border-bottom:1px solid rgba(0,176,255,.07);
  padding:0 12px;overflow-x:auto;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  position:sticky;top:56px;z-index:90;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  scrollbar-width:none;
}
#tabs::-webkit-scrollbar{height:0}
.tab{
  padding:0 18px;height:44px;
  font-family:var(--sans);font-size:10px;font-weight:700;
  letter-spacing:2px;text-transform:uppercase;
  color:var(--td);cursor:pointer;
  border-bottom:2px solid transparent;
  transition:all .2s;white-space:nowrap;
  user-select:none;display:flex;align-items:center;gap:7px;
  position:relative;
}
.tab::after{
  content:'';position:absolute;bottom:-1px;left:50%;right:50%;
  height:2px;background:var(--ui2);
  transition:all .25s cubic-bezier(.4,0,.2,1);border-radius:2px 2px 0 0;
}
.tab:hover{color:var(--ui1)}
.tab:hover::after{left:20%;right:20%}
.tab.on{color:var(--ui2)}
.tab.on::after{left:0;right:0}
.tab-ico{font-size:15px;line-height:1}

/* ══════════════════════════════════════════════
   SIDEBAR — large screens (≥1080px)
══════════════════════════════════════════════ */
@media(min-width:1080px){
  #tabs{
    position:fixed;left:0;top:56px;bottom:0;
    width:64px;
    flex-direction:column;
    border-bottom:none;
    border-right:1px solid rgba(0,176,255,.07);
    padding:16px 0 24px;
    overflow:hidden;overflow-y:auto;
    transition:width .26s cubic-bezier(.4,0,.2,1);
    background:rgba(4,8,16,.97);
    box-shadow:1px 0 0 rgba(0,176,255,.04),4px 0 24px rgba(0,0,0,.3);
  }
  #tabs:hover{width:224px}
  #tabs::-webkit-scrollbar{width:0}

  .tab{
    padding:0 20px;height:46px;
    border-bottom:none;
    border-left:2px solid transparent;
    border-radius:0 12px 12px 0;
    margin:2px 8px 2px 0;
    width:calc(100% - 8px);
    overflow:hidden;white-space:nowrap;
    letter-spacing:1.5px;font-size:9px;
    gap:12px;
  }
  /* remove underline animation on sidebar */
  .tab::after{display:none}

  .tab.on{
    background:linear-gradient(90deg,rgba(0,176,255,.1),rgba(0,176,255,.04));
    border-left-color:var(--ui2);
    color:var(--ui2);
  }
  .tab:hover:not(.on){
    background:rgba(255,255,255,.04);
    color:var(--ui1);
    border-left-color:rgba(0,229,176,.3);
  }
  .tab-ico{flex-shrink:0;font-size:17px}
  .tab-lbl{opacity:0;transition:opacity .18s .06s;white-space:nowrap;font-size:10px}
  #tabs:hover .tab-lbl{opacity:1}

  /* sidebar divider */
  .tab-sep{
    height:1px;
    background:linear-gradient(90deg,rgba(0,176,255,.15),transparent);
    margin:8px 14px;flex-shrink:0;
    width:30px;transition:width .26s;
  }
  #tabs:hover .tab-sep{width:calc(100% - 28px)}

  /* header and ticker shift */
  #tkbar,#hdr{padding-left:80px;transition:padding-left .26s cubic-bezier(.4,0,.2,1)}
  body.sb-open #tkbar,body.sb-open #hdr{padding-left:240px}
  .wrap{margin-left:64px;max-width:1300px;transition:margin-left .26s}
  body.sb-open .wrap{margin-left:224px}
}

/* ══════════════════════════════════════════════
   BOTTOM NAV — mobile (≤767px)
══════════════════════════════════════════════ */
#bottom-nav{display:none}
@media(max-width:767px){
  #tabs{display:none}
  #bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    height:60px;
    background:rgba(4,8,16,.97);
    border-top:1px solid rgba(0,176,255,.1);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    z-index:200;align-items:stretch;
    overflow-x:auto;overflow-y:hidden;
    box-shadow:0 -4px 24px rgba(0,0,0,.4);
  }
  #bottom-nav::-webkit-scrollbar{height:0}
  .bnav-item{
    flex:1;min-width:54px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;
    cursor:pointer;transition:all .2s;color:var(--td);
    border-top:2px solid transparent;
    font-size:7px;letter-spacing:.5px;text-transform:uppercase;
    font-family:var(--sans);font-weight:700;
    padding:2px 4px;text-align:center;position:relative;
  }
  .bnav-item::before{
    content:'';position:absolute;top:-1px;left:20%;right:20%;
    height:2px;background:var(--ui2);border-radius:0 0 2px 2px;
    transform:scaleX(0);transition:transform .2s;
  }
  .bnav-item.on{color:var(--ui2);background:rgba(0,176,255,.05)}
  .bnav-item.on::before{transform:scaleX(1)}
  .bnav-item:active{background:rgba(255,255,255,.05)}
  .bnav-ico{font-size:20px;line-height:1}
  .wrap{padding-bottom:74px}
  #progbar{bottom:60px}
}

.page{display:none}.page.on{display:block;animation:fadeUp .22s ease}
.wrap{max-width:1300px;margin:0 auto;padding:20px 18px 60px}

/* SECTION */
.stitle{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px}
.sl{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--tb);letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sl::before{content:'';width:3px;height:15px;background:var(--ui-grd);border-radius:2px;flex-shrink:0}
.sr{font-size:9px;color:var(--td);letter-spacing:1px}

/* INPUTS */
.add-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.inp{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;color:var(--tb);outline:none;transition:all .2s;width:180px;text-transform:uppercase}
.inp::placeholder{text-transform:none;color:var(--td)}.inp:focus{border-color:var(--ui2);box-shadow:0 0 0 2px rgba(0,176,255,.12)}
.btnadd{background:rgba(0,176,255,.08);border:1px solid rgba(0,176,255,.35);color:var(--ui2);padding:9px 14px;border-radius:8px;cursor:pointer;font-size:10px;letter-spacing:1px;display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap}
.btnadd:hover:not(:disabled){background:var(--ui-grd);color:#000;}.btnadd:disabled{opacity:.4;cursor:not-allowed}
.sp{width:12px;height:12px;border:2px solid rgba(255,255,255,.1);border-top-color:var(--ui2);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;flex-shrink:0}

/* INDICES */
.idx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.idx-card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:14px;
  transition:all .2s;position:relative;overflow:hidden}
.idx-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(0,176,255,.25),transparent)}
.idx-card:hover{border-color:rgba(0,176,255,.2);transform:translateY(-1px)}
.idx-n{font-size:9px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.idx-v{font-family:var(--sans);font-size:18px;font-weight:700;color:var(--tb)}
.idx-c{font-size:11px;font-weight:700;margin-top:3px}

/* ══════════════════════════════════════════════
   TEMA CLARO — premium institucional
══════════════════════════════════════════════ */
body.light{
  /* Cinza azulado premium — não branco puro */
  --bg:#e2e8f0;
  --bg2:#edf2f7;
  --bg3:#d8e0ea;
  --bd:#bec8d6;
  --t:#3d4f63;
  --td:#7a8fa6;
  --tb:#0f1e2e;
  --ui1:#00966d;
  --ui2:#005fcb;
  --ui-grd:linear-gradient(135deg,#00966d,#005fcb);
  --g:#00875a;--gd:rgba(0,135,90,.1);--gb:rgba(0,135,90,.18);
  --r:#c0222e;--rd:rgba(192,34,46,.09);
  --a:#a0520a;--ad:rgba(160,82,10,.09);
  --b:#005fcb;--bld:rgba(0,95,203,.1);
  --p:#5b21b6;--pd:rgba(91,33,182,.09);
  --shadow:0 4px 20px rgba(0,0,0,.13);
  --glow:0 0 20px rgba(0,95,203,.12);
}
body.light{background:var(--bg);color:var(--t)}
body.light::before{background:radial-gradient(ellipse at 15% 0%,rgba(0,95,203,.06) 0%,transparent 50%),radial-gradient(ellipse at 85% 100%,rgba(0,150,109,.04) 0%,transparent 50%)}
body.light #hdr{background:rgba(220,228,238,.96);border-bottom-color:rgba(0,95,203,.14);box-shadow:0 1px 0 rgba(0,95,203,.1),0 4px 16px rgba(0,0,0,.09)}
body.light #hdr::before{background:linear-gradient(90deg,transparent,rgba(0,150,109,.5),rgba(0,95,203,.5),transparent)}
body.light .logo-name{background:linear-gradient(135deg,#0f1e2e 50%,rgba(0,150,109,.9));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
body.light .logo-box{box-shadow:0 0 14px rgba(0,95,203,.22),0 2px 8px rgba(0,0,0,.18)}
body.light #clock{background:rgba(160,82,10,.08);border-color:rgba(160,82,10,.2);color:#6b3a08}
body.light #eta{color:var(--td)}
body.light #tkbar{background:rgba(210,218,228,.97);border-bottom-color:rgba(0,95,203,.12)}
body.light .tk-tag{background:rgba(0,95,203,.1);color:var(--ui2);border-color:rgba(0,95,203,.2)}
body.light .tk-item{color:var(--tb)}
body.light .idx-card{background:var(--bg2);border-color:var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.07)}
body.light .idx-card:hover{border-color:rgba(0,95,203,.3);box-shadow:0 4px 16px rgba(0,95,203,.1)}
body.light .idx-v{color:var(--tb)}.body.light .idx-n{color:var(--td)}
body.light .card{background:var(--bg2);border-color:var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.07)}
body.light .card:hover{box-shadow:0 6px 20px rgba(0,0,0,.11)}
body.light .card-up:hover{border-color:rgba(0,135,90,.35)}
body.light .card-dn:hover{border-color:rgba(192,34,46,.35)}
body.light .c-sym,.body.light .c-price{color:var(--tb)}
body.light .c-name,.body.light .cs-l,.body.light .c-abs{color:var(--td)}
body.light .c-foot{border-top-color:var(--bd)}
body.light .cs-v{color:var(--t)}
body.light #tabs{background:rgba(206,215,226,.98);border-right-color:rgba(0,95,203,.1);border-bottom-color:rgba(0,95,203,.1);box-shadow:1px 0 0 rgba(0,95,203,.07),4px 0 16px rgba(0,0,0,.08)}
body.light .tab{color:var(--td)}
body.light .tab.on{background:rgba(0,95,203,.1);color:var(--ui2);border-left-color:var(--ui2)}
body.light .tab:hover:not(.on){background:rgba(0,0,0,.04);color:var(--t)}
body.light #bottom-nav{background:rgba(214,222,232,.98);border-top-color:rgba(0,95,203,.13);box-shadow:0 -4px 16px rgba(0,0,0,.09)}
body.light .bnav-item.on{background:rgba(0,95,203,.09);color:var(--ui2)}
body.light .bnav-item.on::before{background:var(--ui2)}
body.light #overlay{background:rgba(196,206,218,.88)}
body.light .modal{background:var(--bg2);border-color:var(--bd);box-shadow:0 16px 48px rgba(0,0,0,.16)}
body.light .m-l{color:var(--td)}.body.light .m-v{color:var(--tb)}.body.light .m-t{color:var(--tb)}
body.light .dcard,.body.light .cal-card,.body.light .ncard,.body.light .ct-card{background:var(--bg2);border-color:var(--bd);box-shadow:0 2px 8px rgba(0,0,0,.06)}
body.light .empty-box{color:var(--td)}.body.light .empty-box .et{color:var(--t)}
body.light ::-webkit-scrollbar-track{background:var(--bg2)}
body.light ::-webkit-scrollbar-thumb{background:var(--bd)}
body.light ::-webkit-scrollbar-thumb:hover{background:#9aafc4}
body.light .tblwrap{background:var(--bg2);border-color:var(--bd)}
body.light table{color:var(--t)}.body.light thead tr{background:var(--bg3)}
body.light th{color:var(--td);border-bottom-color:var(--bd)}
body.light td{border-bottom-color:rgba(174,188,208,.45)}
body.light .inp,.body.light .sim-inp,.body.light .ct-search{background:var(--bg3);border-color:var(--bd);color:var(--tb)}
body.light .btnadd{background:rgba(0,95,203,.09);border-color:rgba(0,95,203,.28);color:var(--ui2)}
body.light .btnadd:hover{background:var(--ui-grd);color:#fff;border-color:transparent}
body.light .gr-wm-cover{background:var(--bg2)}

/* ── Toggle button ────────────────────────────── */
#theme-toggle{
  width:36px;height:20px;
  background:var(--bg3);border:1px solid var(--bd);border-radius:20px;
  cursor:pointer;position:relative;transition:all .25s;flex-shrink:0;
  display:flex;align-items:center;padding:2px;
}
#theme-toggle::after{
  content:'';width:14px;height:14px;border-radius:50%;
  background:var(--ui-grd);transition:transform .25s cubic-bezier(.34,1.3,.64,1);
  flex-shrink:0;
}
body.light #theme-toggle::after{transform:translateX(16px)}
#theme-toggle-ico{
  position:absolute;font-size:9px;pointer-events:none;
  right:4px;top:50%;transform:translateY(-50%);
  transition:opacity .2s;
}
body.light #theme-toggle-ico{right:auto;left:4px}

/* ══════════════════════════════════════════════
   CARDS DO MERCADO — premium redesign
══════════════════════════════════════════════ */
.agrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
  gap:12px;margin-bottom:28px;
}
.card{
  background:var(--bg2);border:1px solid var(--bd);border-radius:14px;
  padding:16px 17px;cursor:pointer;transition:all .22s;
  position:relative;overflow:hidden;
  animation:fadeUp .25s ease both;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
}
.card::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  transform:scaleX(0);transform-origin:left;transition:transform .3s;
}
.card-up::after{background:linear-gradient(90deg,var(--g),transparent)}
.card-dn::after{background:linear-gradient(90deg,var(--r),transparent)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.card-up:hover{border-color:rgba(0,230,118,.25)}
.card-dn:hover{border-color:rgba(255,61,87,.25)}
.card:hover::after{transform:scaleX(1)}
.del-btn{
  position:absolute;top:10px;right:10px;width:22px;height:22px;
  border-radius:50%;background:var(--rd);border:1px solid rgba(255,61,87,.3);
  color:var(--r);font-size:10px;display:none;align-items:center;
  justify-content:center;cursor:pointer;transition:.15s;z-index:10;line-height:1;
}
.del-btn:hover{background:var(--r);color:#fff}
.card:hover .del-btn{display:flex}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px}
.c-sym{font-family:var(--sans);font-size:16px;font-weight:800;color:var(--tb)}
.c-name{font-size:8px;color:var(--td);letter-spacing:1px;text-transform:uppercase;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.pill{font-size:8px;padding:3px 8px;border-radius:5px;font-weight:700;letter-spacing:1px;flex-shrink:0}
.pill-a{background:var(--bld);color:var(--b);border:1px solid rgba(56,189,248,.2)}
.pill-f{background:var(--ad);color:var(--a);border:1px solid rgba(255,196,0,.2)}
.c-price{font-family:var(--sans);font-size:22px;font-weight:800;color:var(--tb);letter-spacing:-1px;margin-bottom:7px;line-height:1}
.c-chg{display:flex;align-items:center;gap:6px;margin-bottom:11px}
.pct{font-size:10px;font-weight:700;padding:3px 8px;border-radius:5px}
.pct-up{background:rgba(0,230,118,.09);color:var(--g);border:1px solid rgba(0,230,118,.2)}
.pct-dn{background:var(--rd);color:var(--r);border:1px solid rgba(255,61,87,.2)}
.c-abs{font-size:9px;color:var(--td)}
.c-foot{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--bd)}
.cs{text-align:center;flex:1}
.cs-l{font-size:7px;color:var(--td);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
.cs-v{font-size:10px;color:var(--t);font-weight:700}
.c-chart-btn{
  position:absolute;bottom:11px;right:11px;font-size:8px;
  background:rgba(0,176,255,.08);border:1px solid rgba(0,176,255,.2);
  color:var(--ui2);padding:3px 8px;border-radius:5px;cursor:pointer;
  transition:.15s;display:none;font-family:var(--sans);font-weight:700;
  letter-spacing:.5px;z-index:5;
}
.card:hover .c-chart-btn{display:block}
.c-chart-btn:hover{background:rgba(0,176,255,.2)}

/* skeleton loading */
@keyframes skeleton{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skel{
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bd) 50%,var(--bg3) 75%);
  background-size:200% 100%;animation:skeleton 1.5s ease infinite;
  border-radius:4px;
}
.card.loading-card{cursor:default;pointer-events:none}
.card.loading-card .skel-line{height:11px;margin-bottom:8px}
.card.loading-card .skel-price{height:26px;width:55%;margin-bottom:10px}
.card.loading-card .skel-pct{height:20px;width:40%;border-radius:5px}

/* estado vazio melhorado */
.empty-box{
  text-align:center;padding:56px 24px;color:var(--td);
  grid-column:1/-1;
}
.empty-box .ei{font-size:40px;display:block;margin-bottom:14px;opacity:.7}
.empty-box .et{
  font-family:var(--sans);font-size:14px;font-weight:800;
  color:var(--t);display:block;margin-bottom:7px;
}
.empty-box span:last-child{font-size:11px;line-height:1.6}

/* MODAL */
#overlay{position:fixed;inset:0;background:rgba(2,4,10,.92);z-index:500;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px)}
#overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:24px;width:360px;max-width:100%;box-shadow:var(--shadow);animation:fadeUp .2s ease}
.m-t{font-family:var(--sans);font-size:18px;font-weight:800;color:var(--tb);margin-bottom:2px}
.m-s{font-size:9px;color:var(--td);letter-spacing:1px;margin-bottom:16px}
.m-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:11px}
.m-row:last-of-type{border-bottom:none}
.m-l{color:var(--td)}.m-v{font-weight:700}
.btnclose{width:100%;margin-top:16px;background:var(--bg3);border:1px solid var(--bd);color:var(--t);padding:10px;border-radius:8px;cursor:pointer;font-size:10px;letter-spacing:2px;transition:all .2s}
.btnclose:hover{border-color:var(--ui2);color:var(--ui2);}

/* PROGRESS */
#progbar{height:2px;background:var(--bd);position:fixed;bottom:0;left:0;right:0;z-index:300}
#progfill{height:100%;background:var(--ui-grd);width:0%;transition:width 1s linear}

/* DIVIDENDS */
.div-hero{background:linear-gradient(135deg,rgba(255,196,0,.06),transparent 70%);border:1px solid rgba(255,196,0,.15);border-radius:14px;padding:18px 22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}

.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:24px}
.dcard{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:16px;position:relative;overflow:hidden;transition:all .2s}

.dcard::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--a),transparent)}

.dcard.dcard-pending::before{background:linear-gradient(90deg,var(--a),transparent)}.dcard.dcard-pending{border-color:rgba(255,196,0,.2)}
.dc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:11px}
.dc-sym{font-family:var(--sans);font-size:14px;font-weight:800;color:var(--tb)}

.dc-amt{font-family:var(--sans);font-size:22px;font-weight:800;color:var(--a)}
.dc-sub{font-size:9px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:11px}
.drow{display:flex;justify-content:space-between;font-size:10px;padding:5px 0;border-bottom:1px solid rgba(23,32,48,.8)}
.drow:last-child{border-bottom:none}
.drl{color:var(--td)}.drv{color:var(--tb);font-weight:700}
.drv-g{color:var(--g)}.drv-a{color:var(--a)}
.dbadge{display:inline-block;padding:3px 8px;border-radius:5px;font-size:10px;font-weight:700}
.dbadge-up{background:rgba(0,176,255,.08);color:var(--ui2);border:1px solid rgba(0,176,255,.2)}
.dbadge-soon{background:var(--ad);color:var(--a);border:1px solid rgba(255,196,0,.2)}
.dbadge-old{background:var(--bg3);color:var(--td);border:1px solid var(--bd)}
.tblwrap{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;overflow:auto;margin-bottom:20px}
table{width:100%;border-collapse:collapse;min-width:480px}
thead tr{background:var(--bg3)}
th{padding:9px 12px;font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase;text-align:left;border-bottom:1px solid var(--bd);font-weight:700;white-space:nowrap}

/* SIMULATOR */

.alist{display:flex;flex-direction:column;gap:7px;max-height:270px;overflow-y:auto;padding-right:3px;margin-top:9px}

.kbox-l{font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.kbox-v{font-family:var(--sans);font-size:13px;font-weight:800}



/* HEADER */
#hdr{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:50px;background:var(--bg2);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-box{width:32px;height:32px;background:var(--ui-grd);border-radius:7px;display:grid;place-items:center;font-family:var(--sans);font-weight:800;font-size:12px;color:#000}
.logo-name{font-family:var(--sans);font-weight:800;font-size:15px;color:var(--tb);letter-spacing:3px}
.logo-sub{font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase}

/* TABS */

.del-btn{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--rd);border:1px solid var(--r);color:var(--r);font-size:10px;display:none;align-items:center;justify-content:center;cursor:pointer;transition:.2s;z-index:10;line-height:1}

.c-name{font-size:8px;color:var(--td);letter-spacing:1px;text-transform:uppercase;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.pill{font-size:8px;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:1px;flex-shrink:0}
.pill-a{background:var(--bld);color:var(--b);border:1px solid rgba(56,189,248,.3)}
.pill-f{background:var(--ad);color:var(--a);border:1px solid rgba(255,196,0,.3)}
.c-price{font-size:19px;font-weight:700;color:var(--tb);letter-spacing:-1px;margin-bottom:6px}
.c-chg{display:flex;align-items:center;gap:6px}
.pct{font-size:10px;font-weight:700;padding:2px 7px;border-radius:5px}
.pct-up{background:var(--gd);color:var(--g)}.pct-dn{background:var(--rd);color:var(--r)}
.c-abs{font-size:9px;color:var(--td)}
.c-foot{display:flex;justify-content:space-between;margin-top:9px;padding-top:8px;border-top:1px solid var(--bd)}
.cs{text-align:center}.cs-l{font-size:8px;color:var(--td);letter-spacing:1px;text-transform:uppercase;margin-bottom:2px}.cs-v{font-size:9px;color:var(--t)}

/* STATES */
.loading{display:flex;align-items:center;justify-content:center;gap:10px;padding:36px;color:var(--td);font-size:11px;letter-spacing:2px;grid-column:1/-1}
.loading .sp{width:15px;height:15px;border:2px solid var(--bd);border-top-color:var(--ui2)}
.empty-box{text-align:center;padding:42px 20px;color:var(--td);grid-column:1/-1}
.empty-box .ei{font-size:32px;display:block;margin-bottom:11px}
.empty-box .et{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--t);display:block;margin-bottom:5px}
.errmsg{background:var(--rd);border:1px solid rgba(255,61,87,.3);border-radius:8px;padding:12px 14px;color:var(--r);font-size:11px;grid-column:1/-1}

/* MODAL */
#overlay{position:fixed;inset:0;background:rgba(4,8,13,.92);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
#overlay.on{display:flex}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:13px;padding:22px;width:345px;max-width:100%}
.m-t{font-family:var(--sans);font-size:17px;font-weight:800;color:var(--tb);margin-bottom:2px}
.m-s{font-size:9px;color:var(--td);letter-spacing:1px;margin-bottom:15px}
.m-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:11px}
.m-row:last-of-type{border-bottom:none}
.m-l{color:var(--td)}.m-v{font-weight:700}
.btnclose{width:100%;margin-top:15px;background:var(--bg3);border:1px solid var(--bd);color:var(--t);padding:9px;border-radius:7px;cursor:pointer;font-size:10px;letter-spacing:2px;transition:.2s}
.btnclose:hover{border-color:var(--ui2);color:var(--ui2)}

/* PROGRESS */
#progbar{height:2px;background:var(--bd);position:fixed;bottom:0;left:0;right:0;z-index:300}
#progfill{height:100%;background:var(--ui-grd);width:0%;transition:width 1s linear}

/* DIVIDENDS */
.div-hero{background:linear-gradient(135deg,var(--ad),transparent 70%);border:1px solid rgba(255,196,0,.2);border-radius:12px;padding:16px 20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.div-hero-t{font-family:var(--sans);font-size:16px;font-weight:800;color:var(--tb);margin-bottom:3px}
.div-hero-s{font-size:10px;color:var(--td)}
.div-kpis{display:flex;gap:18px}
.kpi-l{font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.kpi-v{font-family:var(--sans);font-size:16px;font-weight:800;color:var(--a)}
.fbar{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.fb{padding:5px 11px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--td);font-size:9px;letter-spacing:1px;cursor:pointer;transition:.2s}
.fb:hover,.fb.on{border-color:var(--a);color:var(--a)}.fb.on{background:var(--ad)}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:11px;margin-bottom:22px}
.dcard{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:14px;position:relative;overflow:hidden;transition:.2s}
.dcard:hover{transform:translateY(-2px)}
.dcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--a),transparent)}
.dcard.duc::before{background:var(--ui-grd)}.dcard.duc{border-color:rgba(0,176,255,.2)}
.dc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.dc-sym{font-family:var(--sans);font-size:14px;font-weight:800;color:var(--tb)}
.dc-name{font-size:8px;color:var(--td);letter-spacing:1px;text-transform:uppercase;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.dc-amt{font-family:var(--sans);font-size:21px;font-weight:800;color:var(--a)}
.dc-sub{font-size:9px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.drow{display:flex;justify-content:space-between;font-size:10px;padding:5px 0;border-bottom:1px solid rgba(28,46,64,.5)}
.drow:last-child{border-bottom:none}
.drl{color:var(--td)}.drv{color:var(--tb);font-weight:700}
.drv-g{color:var(--g)}.drv-a{color:var(--a)}
.dbadge{display:inline-block;padding:3px 7px;border-radius:5px;font-size:10px;font-weight:700}
.dbadge-up{background:rgba(0,176,255,.08);color:var(--ui2);border:1px solid rgba(0,176,255,.2)}
.dbadge-soon{background:var(--ad);color:var(--a);border:1px solid rgba(255,196,0,.25)}
.dbadge-old{background:var(--bg3);color:var(--td);border:1px solid var(--bd)}
.tblwrap{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;overflow:auto;margin-bottom:18px}
table{width:100%;border-collapse:collapse;min-width:480px}
thead tr{background:var(--bg3)}
th{padding:8px 11px;font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase;text-align:left;border-bottom:1px solid var(--bd);font-weight:700;white-space:nowrap}
td{padding:9px 11px;font-size:11px;color:var(--t);border-bottom:1px solid rgba(28,46,64,.35);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,196,0,.02)}
.td-sym{font-family:var(--sans);font-size:12px;font-weight:800;color:var(--tb)}
.td-sub{font-size:8px;color:var(--td);text-transform:uppercase}
.yieldb{background:var(--ad);color:var(--a);border:1px solid rgba(255,196,0,.25);padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700}

/* SIMULATOR */
.sim-hero{background:linear-gradient(135deg,rgba(0,176,255,.05),transparent 70%);border:1px solid rgba(0,176,255,.15);border-radius:12px;padding:16px 20px;margin-bottom:16px}
.sim-hero-t{font-family:var(--sans);font-size:16px;font-weight:800;color:var(--tb);margin-bottom:3px}
.sim-hero-s{font-size:10px;color:var(--td);line-height:1.7}
.sim-lay{display:grid;grid-template-columns:minmax(255px,1fr) minmax(260px,1fr);gap:14px;margin-bottom:14px}
.sim-p{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:16px}
.sim-pt{font-family:var(--sans);font-size:11px;font-weight:700;color:var(--tb);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.sim-lbl{font-size:9px;color:var(--td);letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:4px;margin-top:10px}
.sim-inp{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;padding:9px 11px;color:var(--tb);font-size:13px;outline:none;transition:border-color .2s}
.sim-inp:focus{border-color:var(--ui2);box-shadow:0 0 0 2px rgba(0,176,255,.12)}
.pfxwrap{position:relative}
.pfxwrap::before{content:'R$';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--td);font-size:11px;pointer-events:none}
.pfxwrap .sim-inp{padding-left:32px}
.alist{display:flex;flex-direction:column;gap:6px;max-height:260px;overflow-y:auto;padding-right:2px;margin-top:8px}
.aitem{display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;cursor:pointer;transition:.15s;user-select:none}
.aitem:hover{border-color:rgba(0,176,255,.4)}.aitem.on{border-color:var(--ui2);background:rgba(0,176,255,.06)}
.achk{width:16px;height:16px;border:2px solid var(--bd);border-radius:4px;display:grid;place-items:center;background:transparent;color:#000;font-size:10px;flex-shrink:0;transition:.15s}
.aitem.on .achk{background:var(--ui-grd);border-color:var(--ui2)}
.ainf{flex:1;min-width:0}
.asym{font-family:var(--sans);font-size:12px;font-weight:800;color:var(--tb)}
.aname{font-size:8px;color:var(--td);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ayld{font-size:9px;font-weight:700;color:var(--a);flex-shrink:0}
.man-inp{width:40px;background:var(--bg2);border:1px solid var(--bd);border-radius:4px;padding:3px 4px;color:var(--tb);font-size:9px;outline:none}
.btncalc{background:var(--ui-grd);border:none;color:#000;padding:11px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:800;letter-spacing:1px;width:100%;margin-top:10px;transition:.2s}
.btncalc:hover{opacity:.85}
.income-box{text-align:center;padding:18px 12px;background:linear-gradient(135deg,rgba(0,176,255,.05),transparent);border:1px solid rgba(0,176,255,.12);border-radius:10px;margin-bottom:12px}
.income-lbl{font-size:9px;color:var(--td);letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
.income-val{font-family:var(--sans);font-size:32px;font-weight:800;color:var(--ui1);letter-spacing:-2px;margin-bottom:2px}
.income-sub{font-size:10px;color:var(--td)}
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kbox{background:var(--bg3);border:1px solid var(--bd);border-radius:7px;padding:9px 7px;text-align:center}
.kbox-l{font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
.kbox-v{font-family:var(--sans);font-size:12px;font-weight:800}

/* Calendário de pagamentos */
.cal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:20px}
.cal-card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:.2s}
.cal-card:hover{border-color:rgba(0,176,255,.3);transform:translateY(-2px)}
.cal-header{padding:13px 15px;background:var(--bg3);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center}
.cal-sym{font-family:var(--sans);font-size:15px;font-weight:800;color:var(--tb)}
.cal-name{font-size:8px;color:var(--td);text-transform:uppercase;letter-spacing:.5px;margin-top:1px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-freq{font-size:9px;padding:3px 8px;border-radius:5px;font-weight:700;background:rgba(0,176,255,.08);color:var(--ui2);border:1px solid rgba(0,176,255,.2)}
.cal-cotas{font-size:9px;color:var(--td);margin-top:2px}
.cal-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 15px;border-bottom:1px solid var(--bd)}
.cal-s{text-align:center}
.cal-s-l{font-size:8px;color:var(--td);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.cal-s-v{font-family:var(--sans);font-size:13px;font-weight:800}
.cal-payments{padding:10px 15px 14px}
.cal-pay-title{font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.pay-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:7px;margin-bottom:5px;background:var(--bg3);border:1px solid var(--bd)}
.pay-row.next{background:rgba(0,176,255,.06);border-color:rgba(0,176,255,.3)}
.pay-date{font-size:11px;color:var(--tb);font-weight:700}
.pay-next-badge{font-size:8px;background:var(--ui-grd);color:#000;padding:1px 5px;border-radius:3px;font-weight:700;margin-left:5px}
.pay-val{font-family:var(--sans);font-size:13px;font-weight:800;color:var(--a)}
.pay-cota{font-size:9px;color:var(--td);text-align:right;margin-top:1px}
.no-pay{font-size:10px;color:var(--td);text-align:center;padding:12px;letter-spacing:1px}

/* Bar chart */
.bar-title{font-size:9px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin:14px 0 9px}
.bar-row{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.bar-lbl{font-size:9px;color:var(--td);width:44px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:19px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;background:var(--ui-grd);border-radius:4px;display:flex;align-items:center;padding:0 6px;transition:width .7s}
.bar-fill span{font-size:8px;font-weight:700;color:#000;white-space:nowrap}
.bar-val{font-size:9px;color:var(--tb);font-weight:700;width:74px;flex-shrink:0;text-align:right}

/* NEWS */
.news-hero{background:linear-gradient(135deg,var(--pd),transparent 70%);border:1px solid rgba(192,132,252,.18);border-radius:12px;padding:16px 20px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.news-hero-t{font-family:var(--sans);font-size:16px;font-weight:800;color:var(--tb);margin-bottom:3px}
.news-hero-s{font-size:10px;color:var(--td)}
.btnref{background:var(--pd);border:1px solid var(--p);color:var(--p);padding:8px 14px;border-radius:7px;cursor:pointer;font-size:10px;letter-spacing:1px;display:flex;align-items:center;gap:7px;transition:.2s}
.btnref:hover:not(:disabled){background:var(--p);color:#000}.btnref:disabled{opacity:.5;cursor:not-allowed}
.ncats{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.ncat{padding:5px 11px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:var(--td);font-size:9px;letter-spacing:1px;cursor:pointer;transition:.2s}
.ncat:hover,.ncat.on{border-color:var(--p);color:var(--p)}.ncat.on{background:var(--pd)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:11px}
.ncard{display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--bd);border-radius:10px;overflow:hidden;transition:.2s;cursor:pointer}
.ncard:hover{border-color:rgba(192,132,252,.4);transform:translateY(-2px)}
.ncard-accent{height:3px;flex-shrink:0}
.ncard-body{padding:12px 13px 10px;flex:1}
.ncard-tags{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.ntag{font-size:8px;padding:2px 6px;border-radius:4px;font-weight:700;letter-spacing:1px}
.ntag-dest{background:rgba(255,196,0,.12);color:var(--a);border:1px solid rgba(255,196,0,.2)}
.ncard-title{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--tb);line-height:1.4;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ncard:hover .ncard-title{color:var(--p)}
.ncard-resumo{font-size:10px;color:var(--td);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ncard-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 13px;border-top:1px solid var(--bd)}
.ncard-src{font-size:9px;color:var(--td);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.ncard-tempo{font-size:9px;color:var(--td)}

@media(max-width:720px){
  .sim-lay{grid-template-columns:1fr}
  .agrid{grid-template-columns:1fr 1fr}
  .cal-grid{grid-template-columns:1fr}
}

/* ═══════════════════════════════════════
   MINHA CARTEIRA
═══════════════════════════════════════ */
.ct-hero{background:linear-gradient(135deg,rgba(56,189,248,.08),transparent 70%);border:1px solid rgba(56,189,248,.2);border-radius:12px;padding:18px 22px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.ct-hero-t{font-family:var(--sans);font-size:18px;font-weight:800;color:var(--tb);margin-bottom:3px}
.ct-hero-s{font-size:10px;color:var(--td);letter-spacing:1px}
.ct-kpis{display:flex;gap:20px;flex-wrap:wrap}
.ct-kpi{text-align:center}
.ct-kpi-l{font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.ct-kpi-v{font-family:var(--sans);font-size:18px;font-weight:800;color:var(--b)}

/* Busca */
.ct-search-wrap{position:relative;margin-bottom:14px}
.ct-search{width:100%;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:10px 14px 10px 38px;color:var(--tb);font-size:12px;outline:none;transition:border-color .2s}
.ct-search:focus{border-color:var(--b)}
.ct-search-ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--td);font-size:13px;pointer-events:none}
.ct-suggestions{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);border:1px solid var(--bd);border-radius:8px;z-index:50;overflow:hidden;display:none}
.ct-suggestions.open{display:block}
.ct-sug-item{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;transition:background .15s;font-size:11px}
.ct-sug-item:hover{background:var(--bg3)}
.ct-sug-sym{font-family:var(--sans);font-weight:800;color:var(--tb);font-size:13px}
.ct-sug-name{color:var(--td);font-size:9px;text-transform:uppercase;letter-spacing:.5px}
.ct-sug-price{color:var(--ui2);font-weight:700}

/* Grid de ativos da carteira */
.ct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:24px}
.ct-card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;overflow:hidden;transition:.2s;position:relative}
.ct-card:hover{border-color:rgba(56,189,248,.35);box-shadow:0 6px 24px rgba(56,189,248,.06)}
.ct-card-top{padding:14px 15px 10px;position:relative}
.ct-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.ct-sym{font-family:var(--sans);font-size:16px;font-weight:800;color:var(--tb)}
.ct-name{font-size:8px;color:var(--td);letter-spacing:1px;text-transform:uppercase;margin-top:2px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ct-card-del{width:22px;height:22px;border-radius:50%;background:var(--rd);border:1px solid var(--r);color:var(--r);font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s;flex-shrink:0}
.ct-card-del:hover{background:var(--r);color:#fff}
.ct-price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.ct-price{font-family:var(--sans);font-size:22px;font-weight:800;color:var(--tb);letter-spacing:-1px}
.ct-chg{font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px}
.ct-chg-up{background:var(--gd);color:var(--g)}
.ct-chg-dn{background:var(--rd);color:var(--r)}

/* Input de quantidade */
.ct-qty-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ct-qty-lbl{font-size:9px;color:var(--td);letter-spacing:1px;text-transform:uppercase;flex-shrink:0}
.ct-qty-inp{width:80px;background:var(--bg3);border:1px solid var(--bd);border-radius:5px;padding:5px 8px;color:var(--tb);font-size:11px;outline:none;text-align:center}
.ct-qty-inp:focus{border-color:var(--b)}
.ct-pm-inp{width:110px;background:var(--bg3);border:1px solid var(--bd);border-radius:5px;padding:5px 8px;color:var(--tb);font-size:11px;outline:none}
.ct-pm-inp:focus{border-color:var(--b)}
.ct-pos-badge{font-size:9px;padding:3px 8px;border-radius:4px;font-weight:700}
.ct-pos-up{background:rgba(0,176,255,.08);color:var(--ui2);border:1px solid rgba(0,176,255,.2)}
.ct-pos-dn{background:var(--rd);color:var(--r);border:1px solid rgba(255,61,87,.2)}

/* Mini gráfico sparkline */
.ct-chart-wrap{padding:0 0 10px}
.ct-chart{width:100%;height:55px;display:block}

/* Dividendos do ativo */
.ct-divs{background:var(--bg3);border-top:1px solid var(--bd);padding:10px 15px}
.ct-divs-t{font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}
.ct-div-row{display:flex;justify-content:space-between;font-size:10px;padding:4px 0;border-bottom:1px solid rgba(28,46,64,.4)}
.ct-div-row:last-child{border-bottom:none}
.ct-div-date{color:var(--td)}
.ct-div-val{color:var(--a);font-weight:700}
.ct-div-na{font-size:10px;color:var(--td);font-style:italic;padding:4px 0}

/* Painel de juros compostos */
.ct-compound{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:18px}
.ct-compound-t{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--tb);letter-spacing:2px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.ct-form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.ct-f-lbl{font-size:9px;color:var(--td);letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:5px}
.ct-f-inp{width:100%;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;padding:9px 11px;color:var(--tb);font-size:13px;outline:none;transition:border-color .2s}
.ct-f-inp:focus{border-color:var(--b)}
.ct-pfx{position:relative}
.ct-pfx::before{content:'R$';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--td);font-size:11px;pointer-events:none}
.ct-pfx .ct-f-inp{padding-left:32px}
.ct-toggle{display:flex;gap:0;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
.ct-toggle-btn{flex:1;padding:9px 8px;text-align:center;cursor:pointer;font-size:11px;color:var(--td);transition:.2s;background:var(--bg3);border:none}
.ct-toggle-btn.on{background:var(--b);color:#000;font-weight:700}
.btn-calcular{background:var(--b);border:none;color:#000;padding:11px;border-radius:8px;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:800;letter-spacing:1px;width:100%;transition:.2s;margin-top:4px}
.btn-calcular:hover{opacity:.85}

/* Resultado juros compostos */
.ct-result-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.ct-r-box{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:12px;text-align:center}
.ct-r-lbl{font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.ct-r-val{font-family:var(--sans);font-size:16px;font-weight:800}
.ct-timeline-wrap{overflow-x:auto;padding-bottom:4px}
.ct-timeline{display:flex;gap:8px;min-width:max-content}
.ct-tl-item{text-align:center;min-width:70px}
.ct-tl-bar-wrap{height:80px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}
.ct-tl-bar{width:32px;border-radius:4px 4px 0 0;background:linear-gradient(0deg,var(--b),rgba(56,189,248,.4));transition:height .6s}
.ct-tl-val{font-size:8px;color:var(--tb);font-weight:700;margin-bottom:2px}
.ct-tl-lbl{font-size:8px;color:var(--td);letter-spacing:.5px}

@media(max-width:600px){
  .ct-grid{grid-template-columns:1fr}
  .ct-form-grid{grid-template-columns:1fr 1fr}
}

/* ══════════════════════════════════════════════════════════════
   ABA RI — RELAÇÕES COM INVESTIDORES
   ══════════════════════════════════════════════════════════════ */

/* Hero */
.ri-hero{background:linear-gradient(135deg,rgba(0,176,255,.06),transparent 70%);
  border:1px solid rgba(0,176,255,.15);border-radius:14px;padding:20px 24px;
  margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:14px;position:relative;overflow:hidden}
.ri-hero::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ui-grd)}
.ri-hero-t{font-family:var(--sans);font-size:18px;font-weight:800;color:var(--tb);margin-bottom:5px}
.ri-hero-s{font-size:11px;color:var(--td);max-width:500px;line-height:1.7}
.ri-kpis{display:flex;gap:24px}

/* Search */
.ri-search-wrap{position:relative;margin-bottom:20px}
.ri-search-box{position:relative;display:flex;align-items:center}
.ri-search-ico{position:absolute;left:14px;font-size:16px;pointer-events:none;z-index:1}
.ri-search-inp{width:100%;background:var(--bg2);border:1.5px solid var(--bd);border-radius:12px;
  padding:14px 44px 14px 44px;color:var(--tb);font-family:var(--mono);font-size:14px;
  outline:none;transition:all .25s}
.ri-search-inp:focus{border-color:var(--ui2);background:var(--bg3);
  box-shadow:0 0 0 3px rgba(0,176,255,.1),0 4px 20px rgba(0,0,0,.3)}
.ri-search-inp::placeholder{color:var(--td)}
.ri-clear-btn{position:absolute;right:14px;background:none;border:none;
  color:var(--td);cursor:pointer;font-size:14px;padding:4px;transition:color .2s}
.ri-clear-btn:hover{color:var(--neg)}

/* Suggestions dropdown */
.ri-suggestions{position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--bg2);border:1px solid var(--bd);border-radius:12px;
  z-index:200;max-height:280px;overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.6);display:none}
.ri-suggestions.open{display:block;animation:fadeUp .15s ease}
.ri-sugg-item{display:flex;align-items:center;gap:12px;padding:11px 16px;
  cursor:pointer;border-bottom:1px solid rgba(15,32,48,.6);transition:background .15s}
.ri-sugg-item:last-child{border-bottom:none}
.ri-sugg-item:hover{background:rgba(0,176,255,.06)}
.ri-sugg-logo{width:32px;height:32px;border-radius:8px;object-fit:contain;
  background:var(--bg3);border:1px solid var(--bd);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--td)}
.ri-sugg-ticker{font-family:var(--sans);font-size:13px;font-weight:800;color:var(--tb)}
.ri-sugg-name{font-size:11px;color:var(--td);margin-top:1px}
.ri-sugg-sector{font-size:9px;color:var(--ui2);background:rgba(0,176,255,.08);
  padding:2px 7px;border-radius:4px;border:1px solid rgba(0,176,255,.2);margin-left:auto;white-space:nowrap}

/* Nav tabs internos */
.ri-nav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.ri-nb{padding:7px 16px;border-radius:20px;border:1px solid var(--bd);background:transparent;
  color:var(--td);font-size:10px;letter-spacing:1px;cursor:pointer;transition:all .2s;
  font-family:var(--mono)}
.ri-nb:hover{border-color:var(--ui2);color:var(--ui2)}
.ri-nb.on{background:rgba(0,176,255,.1);border-color:var(--ui2);color:var(--ui2)}

/* Filters */
.ri-filters{display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap}
.ri-filter{padding:5px 13px;border-radius:20px;border:1px solid var(--bd);background:transparent;
  color:var(--td);font-size:9px;letter-spacing:1px;cursor:pointer;transition:all .2s}
.ri-filter:hover,.ri-filter.on{border-color:var(--ui1);color:var(--ui1);background:rgba(0,229,176,.08)}

/* Grid */
.ri-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:24px}
.ri-start{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--td)}

/* Card RI */
.ri-card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;
  padding:18px;transition:all .25s;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.ri-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ui-grd);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.ri-card:hover{transform:translateY(-3px);box-shadow:0 8px 32px rgba(0,0,0,.5);border-color:rgba(0,176,255,.25)}
.ri-card:hover::before{transform:scaleX(1)}

.ri-card-head{display:flex;align-items:flex-start;gap:12px}
.ri-logo{width:44px;height:44px;border-radius:10px;object-fit:contain;
  background:var(--bg3);border:1px solid var(--bd);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:11px;
  font-family:var(--sans);font-weight:800;color:var(--ui2)}
.ri-logo img{width:100%;height:100%;object-fit:contain;border-radius:10px}
.ri-card-info{flex:1;min-width:0}
.ri-card-ticker{font-family:var(--sans);font-size:16px;font-weight:800;color:var(--tb);margin-bottom:2px}
.ri-card-name{font-size:11px;color:var(--t);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-card-full{font-size:9px;color:var(--td);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-fav-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:2px;
  transition:transform .2s;flex-shrink:0}
.ri-fav-btn:hover{transform:scale(1.2)}

.ri-sector{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:6px;
  font-size:9px;font-weight:700;letter-spacing:1px;
  background:rgba(0,176,255,.08);color:var(--ui2);border:1px solid rgba(0,176,255,.2)}

.ri-card-footer{display:flex;gap:8px;margin-top:4px}
.ri-btn{flex:1;padding:10px;border-radius:9px;font-family:var(--sans);font-size:11px;
  font-weight:700;cursor:pointer;transition:all .2s;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:6px}
.ri-btn-main{background:var(--ui-grd);color:#000;border:none}
.ri-btn-main:hover{opacity:.88;box-shadow:0 4px 14px rgba(0,176,255,.3)}
.ri-btn-ext{background:rgba(0,176,255,.08);color:var(--ui2);border:1px solid rgba(0,176,255,.3)}
.ri-btn-ext:hover{background:rgba(0,176,255,.15)}

/* Not found */
.ri-notfound{grid-column:1/-1;text-align:center;padding:40px;background:var(--bg2);
  border:1px solid var(--bd);border-radius:14px}

/* Responsive */
@media(max-width:600px){
  .ri-hero{padding:14px 16px}
  .ri-hero-t{font-size:15px}
  .ri-grid{grid-template-columns:1fr}
  .ri-search-inp{font-size:13px;padding:12px 40px}
  .ri-kpis{display:none}
}

/* ══════════════════════════════════════════════════════════════
   ABA ANÁLISE GRÁFICA — PROFESSIONAL CHART PAGE
   ══════════════════════════════════════════════════════════════ */

/* Hero */
.gc-hero{background:linear-gradient(135deg,rgba(0,229,176,.06) 0%,rgba(0,176,255,.04) 50%,transparent 100%);

  position:relative;overflow:hidden}

  display:flex;align-items:center;gap:10px}

/* Search */
.gc-search-outer{position:relative;max-width:680px;margin-bottom:20px}
.gc-search-row{display:flex;gap:8px;align-items:center}
.gc-search-rel{position:relative;flex:1}
.gc-search-ico{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none;z-index:2}
.gc-search-inp{width:100%;background:var(--bg2);border:1.5px solid var(--bd);border-radius:12px;
  padding:14px 16px 14px 48px;color:var(--tb);font-family:var(--mono);font-size:14px;
  outline:none;transition:all .25s;text-transform:uppercase}
.gc-search-inp::placeholder{text-transform:none;color:var(--td);font-size:12px}
.gc-search-inp:focus{border-color:var(--ui1);background:var(--bg3);
  box-shadow:0 0 0 3px rgba(0,229,176,.1),0 6px 24px rgba(0,0,0,.4)}
.gc-search-btn{background:var(--ui-grd);border:none;border-radius:10px;
  padding:14px 22px;color:#000;font-family:var(--sans);font-size:12px;font-weight:800;
  letter-spacing:1px;cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0}
.gc-search-btn:hover{opacity:.88;box-shadow:0 4px 20px rgba(0,229,176,.3)}

/* Suggestions dropdown */
.gc-suggestions{position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--bg2);border:1px solid var(--bd);border-radius:12px;
  z-index:300;max-height:320px;overflow-y:auto;
  box-shadow:0 10px 40px rgba(0,0,0,.7);display:none}
.gc-suggestions.open{display:block;animation:fadeUp .15s ease}
.gc-sugg-item{display:flex;align-items:center;gap:14px;padding:12px 18px;
  cursor:pointer;border-bottom:1px solid rgba(23,32,48,.7);transition:background .15s}
.gc-sugg-item:last-child{border-bottom:none}
.gc-sugg-item:hover{background:rgba(0,229,176,.06)}
.gc-sugg-sym{font-family:var(--sans);font-size:15px;font-weight:800;color:var(--tb);min-width:80px}
.gc-sugg-name{font-size:11px;color:var(--td);flex:1}
.gc-sugg-price{font-size:12px;font-weight:700;color:var(--ui2);text-align:right}

/* Empty state */
.gc-empty-state{text-align:center;padding:60px 20px;background:var(--bg2);
  border:1px solid var(--bd);border-radius:16px}
.gc-empty-icon{font-size:56px;margin-bottom:16px;display:block}
.gc-empty-t{font-family:var(--sans);font-size:18px;font-weight:800;color:var(--tb);margin-bottom:8px}
.gc-empty-s{font-size:12px;color:var(--td);line-height:1.8;max-width:420px;margin:0 auto 24px}

/* Popular chips */
.gc-popular-t{font-size:9px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.gc-popular-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.gc-chip{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;
  background:var(--bg3);border:1px solid var(--bd);border-radius:8px;
  cursor:pointer;transition:all .2s;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--tb)}
.gc-chip:hover{border-color:var(--ui1);color:var(--ui1);transform:translateY(-1px);
  box-shadow:0 4px 12px rgba(0,229,176,.15)}
.gc-chip-t{font-size:8px;font-weight:700;padding:2px 5px;border-radius:3px;letter-spacing:.5px}
.gc-chip-a{background:var(--bld);color:var(--b);border:1px solid rgba(56,189,248,.2)}
.gc-chip-f{background:var(--ad);color:var(--a);border:1px solid rgba(255,196,0,.2)}
.gc-chip-e{background:var(--gd);color:var(--g);border:1px solid rgba(0,230,118,.2)}

/* Asset header panel */
.gc-asset-hdr{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;

  justify-content:space-between;flex-wrap:wrap;gap:16px;position:relative;overflow:hidden}
.gc-asset-hdr::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--ui-grd)}
.gc-ah-left{display:flex;flex-direction:column;gap:3px}
.gc-ah-sym{font-family:var(--sans);font-size:28px;font-weight:800;color:var(--tb);letter-spacing:-1px}
.gc-ah-name{font-size:11px;color:var(--td);letter-spacing:.5px}
.gc-ah-center{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.gc-ah-price{font-family:var(--sans);font-size:30px;font-weight:800;color:var(--tb);letter-spacing:-1.5px}

.gc-chg-dn{background:var(--rd);color:var(--r);border:1px solid rgba(255,61,87,.25)}
.gc-ah-abs{font-size:11px;opacity:.75}
.gc-ah-stats{display:flex;gap:20px;flex-wrap:wrap}
.gc-stat{text-align:center;min-width:65px}
.gc-stat-l{font-size:8px;color:var(--td);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:4px}
.gc-stat-v{font-family:var(--sans);font-size:13px;font-weight:700;color:var(--tb)}

.gc-controls{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;

/* ══════════════════════════════════════════════════════════
   HEATMAP DA B3 — Progressive loading por setor
══════════════════════════════════════════════════════════ */

const HM_SECTORS = {
  "Bancos":    ["ITUB4","BBDC4","BBAS3","SANB11","BPAC11"],
  "Petróleo":  ["PETR4","PRIO3","RECV3","UGPA3"],
  "Mineração": ["VALE3","GGBR4","CSNA3"],
  "Energia":   ["EGIE3","TAEE11","CPFE3","CMIG4"],
  "Varejo":    ["LREN3","MGLU3","NTCO3"],
  "Saúde":     ["RDOR3","HAPV3","FLRY3"],
  "Agro":      ["JBSS3","AGRO3","MRFG3"],
  "FIIs":      ["HGLG11","MXRF11","XPML11","KNRI11","MALL11"],
};

const HM_ICONS = {
  "Bancos":"🏦","Petróleo":"🛢️","Mineração":"⛏️","Energia":"⚡",
  "Varejo":"🛒","Saúde":"🏥","Agro":"🌾","FIIs":"🏢",
};

let _hmCache = {};     // {SYMBOL: {price,change,name}}
let _hmLoading = false;

function hmCellClass(chg){
  if(chg >=  4) return "c-pp";
  if(chg >=  1.5) return "c-p";
  if(chg >   0.1) return "c-pl";
  if(chg >= -0.1) return "c-n";
  if(chg >= -1.5) return "c-nl";
  if(chg >= -4)   return "c-m";
  return "c-mm";
}

function hmChgColor(chg){
  return chg > 0.05 ? "#00e676" : chg < -0.05 ? "#ff3d57" : "var(--td)";
}

function hmFmt(n){
  return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}

function hmBuildSectorCard(name, syms, data){
  const cells = syms.map(sym=>{
    const d = data[sym];
    if(!d) return `<div class="hm-cell skeleton"></div>`;
    const cls   = hmCellClass(d.change);
    const color = hmChgColor(d.change);
    const sign  = d.change > 0 ? "+" : "";
    return `<div class="hm-cell ${cls}"
      onclick="goTab(document.querySelector('[data-tab=graficos]'));setTimeout(()=>gcLoadAsset('${sym}'),120)"
      title="${d.name} · R$ ${hmFmt(d.price)} · ${sign}${d.change.toFixed(2)}%">
      <div class="hm-cell-sym">${sym}</div>
      <div class="hm-cell-chg" style="color:${color}">${sign}${d.change.toFixed(2)}%</div>
      <div class="hm-cell-price">R$ ${hmFmt(d.price)}</div>
    </div>`;
  }).join("");

  // Média do setor
  const loaded = syms.filter(s=>data[s]);
  const avg = loaded.length
    ? loaded.reduce((s,sym)=>s+data[sym].change,0)/loaded.length
    : null;
  const avgTxt = avg!==null
    ? `${avg>=0?"+":""}${avg.toFixed(2)}%`
    : "…";
  const avgCls = avg===null?"neu":avg>0.05?"pos":avg<-0.05?"neg":"neu";

  return `<div class="hm-sector-card" id="hm-sec-${name.replace(/\s/g,"")}">
    <div class="hm-sector-head">
      <div class="hm-sector-name">${HM_ICONS[name]||""} ${name}</div>
      <div class="hm-sector-avg ${avgCls}">${avgTxt}</div>
    </div>
    <div class="hm-cells">${cells}</div>
  </div>`;
}

async function hmFetchSector(name, syms){
  const symsStr = syms.join(",");
  try{
    const results = await apiFetch(`/api/heatmap-sector?syms=${symsStr}`);
    if(Array.isArray(results)){
      results.forEach(d=>{ if(d.symbol) _hmCache[d.symbol]=d; });
    }
  }catch(e){
    console.warn(`Heatmap sector ${name}:`,e.message);
  }
  // Re-render this sector card with fresh data
  const card = document.getElementById(`hm-sec-${name.replace(/\s/g,"")}`);
  if(card){
    const tmp = document.createElement("div");
    tmp.innerHTML = hmBuildSectorCard(name, syms, _hmCache);
    const newCard = tmp.firstChild;
    newCard.style.animation = "hmFadeIn .3s ease both";
    card.replaceWith(newCard);
  }
}

async function hmLoadAll(force=false){
  const grid   = $("hm-grid");
  const dot    = $("hm-live-dot");
  const status = $("hm-status-txt");
  if(!grid) return;
  if(_hmLoading && !force) return;

  _hmLoading = true;
  if(force) _hmCache = {};
  if(dot)    dot.className    = "hm-live-dot";
  if(status) status.textContent = "Atualizando…";

  // Mostra skeletons imediatamente
  grid.innerHTML = Object.entries(HM_SECTORS).map(([name,syms])=>
    hmBuildSectorCard(name, syms, {})
  ).join("");

  try{
    // UMA única chamada — o servidor busca tudo sequencialmente sem rate limit
    const data = await apiFetch("/api/heatmap-all");

    if(data && typeof data === "object"){
      // Popula cache local e re-renderiza cada setor
      Object.entries(data).forEach(([name, cells])=>{
        (cells||[]).forEach(d=>{ if(d && d.symbol) _hmCache[d.symbol]=d; });
        const card = document.getElementById(`hm-sec-${name.replace(/\s/g,"")}`);
        if(card){
          const tmp = document.createElement("div");
          tmp.innerHTML = hmBuildSectorCard(name, HM_SECTORS[name]||[], _hmCache);
          const newCard = tmp.firstChild;
          if(newCard){
            newCard.style.animation = "hmFadeIn .3s ease both";
            card.replaceWith(newCard);
          }
        }
      });
    }
  }catch(e){
    console.warn("Heatmap:", e.message);
  }

  // Footer stats
  const allLoaded = Object.values(_hmCache);
  const pos  = allLoaded.filter(d=>d.change >  0.05).length;
  const neg  = allLoaded.filter(d=>d.change < -0.05).length;
  const flat = allLoaded.length - pos - neg;
  const footer = $("hm-footer-stats");
  if(footer && allLoaded.length){
    footer.innerHTML =
      `<span style="color:var(--g)">▲ ${pos} em alta</span> · ` +
      `<span style="color:var(--r)">▼ ${neg} em baixa</span> · ` +
      `<span style="color:var(--td)">${flat} estáveis · ${allLoaded.length} ativos</span>`;
  }

  const ok = allLoaded.length > 0;
  if(dot)    dot.className = ok ? "hm-live-dot" : "hm-live-dot err";
  if(status) status.textContent = ok
    ? new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})
    : "Sem dados — tente novamente";

  _hmLoading = false;
}

/* ══════════════════════════════════════════════════════════
   SCORE DE SAÚDE DA CARTEIRA
══════════════════════════════════════════════════════════ */
async function loadPortfolioScore(){
  const sec  = $("score-section");
  const cont = $("score-content");
  if(!sec || !cont) return;

  const keys = Object.keys(carteira);
  if(!keys.length){ sec.style.display="none"; return; }
  sec.style.display = "block";
  cont.innerHTML = '<div class="loading"><div class="sp"></div>ANALISANDO CARTEIRA…</div>';

  try{
    const d = await apiFetch("/api/portfolio-score");
    if(!d || d.error){
      cont.innerHTML = `<div class="errmsg">⚠ ${d?.error||"Erro ao calcular score"}</div>`; return;
    }

    const scoreColor = d.score >= 75 ? "#00e676" : d.score >= 44 ? "#ffc400" : "#ff3d57";
    const barColor   = v => v >= 20 ? "#00e676" : v >= 12 ? "#ffc400" : "#ff3d57";

    // Top ativos breakdown
    const topHtml = (d.top_ativos||[]).map(a=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-family:var(--sans);font-size:11px;font-weight:800;color:var(--tb)">${a.sym}</span>
          <span style="font-size:8px;color:var(--td);letter-spacing:1px">${a.sector}</span>
          ${a.fii ? '<span style="font-size:7px;background:var(--ad);color:var(--a);padding:1px 5px;border-radius:10px;font-weight:700">FII</span>' : ''}
        </div>
        <div style="text-align:right">
          <span style="font-family:var(--sans);font-size:11px;font-weight:800;color:var(--tb)">${a.pct}%</span>
          ${a.dy > 0 ? `<span style="font-size:9px;color:var(--g);margin-left:8px">DY ${a.dy}%</span>` : ''}
        </div>
      </div>`).join("");

    // Sector pills
    const sectorPills = Object.entries(d.sector_dist||{})
      .sort((a,b)=>b[1]-a[1])
      .map(([s,p])=>`<div class="score-sector-pill"><span>${s}</span><span class="score-sector-pct">${p}%</span></div>`)
      .join("");

    const tipsHtml = (d.tips||[]).map(t=>`
      <div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0">
        <span style="color:var(--ui1);flex-shrink:0;margin-top:1px">→</span>
        <span>${t}</span>
      </div>`).join("");

    const closedNotice = d.mercado_fechado
      ? `<div style="background:var(--ad);border:1px solid rgba(255,196,0,.2);border-radius:8px;padding:8px 12px;font-size:9px;color:var(--a);margin-bottom:14px;display:flex;gap:6px;align-items:center">
          <span>⏰</span><span>Mercado fechado — DY será atualizado na abertura (10h)</span>
        </div>` : "";

    const bonusHtml = d.bonus_fiis > 0
      ? `<div style="font-size:9px;color:var(--g);margin-top:4px">+${d.bonus_fiis} pts bônus por ${d.n_fiis} FII${d.n_fiis>1?"s":""} na carteira</div>`
      : "";

    cont.innerHTML = `
      <div class="score-wrap">
        <div class="score-gauge-wrap">
          <div class="score-circle" style="--score-pct:${d.score};--score-color:${scoreColor}">
            <div class="score-inner">
              <div class="score-num" style="color:${scoreColor}">${d.score}</div>
              <div class="score-grade" style="color:${scoreColor}">${d.grade}</div>
            </div>
          </div>
          <div class="score-label">${d.label}</div>
          ${bonusHtml}
        </div>
        <div>
          ${closedNotice}
          <div class="score-bars">
            ${Object.values(d.scores).map(s=>`
              <div class="score-bar-item">
                <div class="score-bar-header">
                  <div>
                    <div class="score-bar-name">${s.label}</div>
                    <div class="score-bar-detail">${s.detail}</div>
                  </div>
                  <div class="score-bar-pts" style="color:${barColor(s.value)}">${s.value}/${s.max}</div>
                </div>
                <div class="score-bar-track">
                  <div class="score-bar-fill" style="width:0%;background:${barColor(s.value)}" data-w="${(s.value/s.max*100).toFixed(0)}%"></div>
                </div>
              </div>`).join("")}
          </div>

          ${topHtml ? `<div style="margin-top:18px">
            <div style="font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">Maiores Posições</div>
            ${topHtml}
          </div>` : ""}

          ${sectorPills ? `<div style="margin-top:14px">
            <div style="font-size:8px;color:var(--td);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">Distribuição Setorial</div>
            <div class="score-sector-grid">${sectorPills}</div>
          </div>` : ""}

          <div class="score-tips">
            <strong>Análise Personalizada</strong>
            <div style="display:flex;flex-direction:column;margin-top:8px">${tipsHtml}</div>
          </div>
        </div>
      </div>`;

    // Animate bars
    requestAnimationFrame(()=>{
      cont.querySelectorAll(".score-bar-fill").forEach(el=>{
        const w = el.dataset.w;
        requestAnimationFrame(()=>{ el.style.width = w; });
      });
    });
  }catch(e){
    cont.innerHTML = `<div class="errmsg">⚠ ${e.message}</div>`;
  }
}
