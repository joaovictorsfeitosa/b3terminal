<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Minha Carteira</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    background: #1e293b;
    padding: 20px;
    border-radius: 10px;
    width: 300px;
}
input, button {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border: none;
    border-radius: 5px;
}
button {
    background: #3b82f6;
    color: white;
    cursor: pointer;
}
</style>

</head>

<body>

<!-- LOGIN -->
<div class="container" id="loginBox">
    <h2>Login</h2>
    <input id="loginUser" placeholder="Usuário">
    <input id="loginPass" type="password" placeholder="Senha">
    <button onclick="login()">Entrar</button>

    <h3>Criar Conta</h3>
    <input id="regUser" placeholder="Novo usuário">
    <input id="regPass" type="password" placeholder="Nova senha">
    <button onclick="register()">Cadastrar</button>
</div>

<!-- DASHBOARD -->
<div class="container" id="dashboard" style="display:none;">
    <h2>Minha Carteira</h2>
    <p id="welcome"></p>

    <input id="ativo" placeholder="Nome do ativo">
    <input id="valor" type="number" placeholder="Valor investido">
    <button onclick="addAtivo()">Adicionar</button>

    <ul id="lista"></ul>

    <button onclick="logout()">Sair</button>
</div>

<script>
let usuarioAtual = null;

// REGISTRAR
async function register() {
    const user = regUser.value;
    const password = regPass.value;

    const res = await fetch("/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ user, password })
    });

    const data = await res.json();
    alert(data.message || data.error);
}

// LOGIN
async function login() {
    const user = loginUser.value;
    const password = loginPass.value;

    const res = await fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ user, password })
    });

    const data = await res.json();

    if (res.ok) {
        usuarioAtual = user;
        abrirDashboard();
    } else {
        alert(data.error);
    }
}

// ABRIR DASHBOARD
function abrirDashboard() {
    loginBox.style.display = "none";
    dashboard.style.display = "block";
    welcome.innerText = "Bem-vindo, " + usuarioAtual;
    carregarCarteira();
}

// ADICIONAR ATIVO
async function addAtivo() {
    const nome = ativo.value;
    const valorNum = valor.value;

    const res = await fetch("/add", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            user: usuarioAtual,
            nome,
            valor: valorNum
        })
    });

    const data = await res.json();
    alert(data.message);

    carregarCarteira();
}

// CARREGAR CARTEIRA
async function carregarCarteira() {
    const res = await fetch("/carteira/" + usuarioAtual);
    const carteira = await res.json();

    lista.innerHTML = "";

    carteira.forEach(item => {
        const li = document.createElement("li");
        li.innerText = item.nome + " - R$ " + item.valor;
        lista.appendChild(li);
    });
}

// LOGOUT
function logout() {
    usuarioAtual = null;
    dashboard.style.display = "none";
    loginBox.style.display = "block";
}
</script>

</body>
</html>
